[pytest]
testpaths = tests
python_files = test_*.py

# Rule 9 item 3 — the unit/integration split, made mechanical.
#
# Unit tests need no Docker, no Postgres, and no armada-models, so they run on every push.
# Anything needing a live stack carries @pytest.mark.integration and is deselected with:
#
#   pytest -m "not integration"
#
# Marking rather than a separate directory keeps an integration test next to the unit tests
# for the same module, where it is likely to be read and maintained.
markers =
    integration: requires a live stack (Postgres, armada-models, or Docker)

addopts = --strict-markers
