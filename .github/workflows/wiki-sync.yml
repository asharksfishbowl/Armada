name: Wiki sync

# ─────────────────────────────────────────────────────────────────────────────
# Publishes docs/ to the GitHub wiki. docs/ is the SOURCE; the wiki is a MIRROR.
#
# The wiki is a separate git repository with no review, no CI and no history that
# anyone reads. Documentation that lives only there drifts away from the code it
# describes, because nothing ever fails when it does. Keeping the source in docs/
# means a doc change is reviewed in the same PR as the code change, and this job
# makes the published copy follow.
#
# NOTE THE TRIGGER. It fires on exactly the paths ci.yml and codeql.yml IGNORE, so
# a docs-only commit runs this and nothing else, and a code-only commit runs those
# and not this. A commit touching both correctly runs all three. No overlap.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/sync-wiki.mjs'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  # `true`, unlike ci.yml: this publishes the current state of docs/ rather than
  # verifying one commit, so a superseded run's output is exactly what the newer
  # run is about to write. Cancelling loses nothing. Same reasoning as codeql.yml.
  group: wiki-sync
  cancel-in-progress: true

permissions:
  contents: write   # the wiki is a repo; pushing to it needs write, not read

jobs:
  sync:
    name: Publish docs/ to the wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The wiki repository is NOT created until its first page is saved through the
      # web UI — `has_wiki: true` only means the feature is enabled. There is no API
      # to create it, so a clone failing here means someone disabled the wiki or it
      # was never initialised, and the message should say that rather than "not found".
      - name: Clone the wiki
        run: |
          if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki 2>/dev/null; then
            echo "::error::Could not clone ${{ github.repository }}.wiki.git. The wiki repository does not exist until its first page is created in the web UI, and there is no API for that. Create any page, then re-run."
            exit 1
          fi

      # Rewrites links, builds the sidebar, and FAILS if a docs page is missing from
      # the sidebar order — an unreachable page is the same as no page.
      - name: Generate pages
        run: node scripts/sync-wiki.mjs wiki

      - name: Push if anything changed
        working-directory: wiki
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          # A no-op sync is the common case — most pushes to main change no docs at
          # all, and `git commit` exits non-zero with nothing staged.
          if git diff --cached --quiet; then
            echo "wiki already matches docs/ — nothing to publish"
            exit 0
          fi
          git diff --cached --stat
          git commit -q -m "Publish docs/ to the wiki (${GITHUB_SHA:0:7})

          Generated by scripts/sync-wiki.mjs. Do not edit here — the next sync
          overwrites it. Change docs/ in the main repository instead."
          git push origin HEAD:master
