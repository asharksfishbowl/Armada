# `Connection` must be `upgrade` for a WebSocket handshake and empty for an ordinary
# request. Hardcoding "upgrade" on the /forge/ block would break its plain HTTP calls,
# which is nearly all of them, so it is mapped from the request's own Upgrade header.
#
# This sits OUTSIDE the server block on purpose: `map` is only valid at http level, and
# conf.d/*.conf is included there. It is in this file rather than a second one so the
# directive travels with the block that uses it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Same-origin proxying ────────────────────────────────────────────────────────────
    #
    # THIS IS LOAD-BEARING, NOT A CONVENIENCE. Neither armada-daemon nor armada-forge emits
    # a single CORS header, and neither handles an OPTIONS preflight — a preflight to the
    # daemon falls through its hand-rolled dispatch chain and answers 404. So the browser
    # MUST see the dashboard, the daemon, and the forge as one origin, and this is where
    # that happens.
    #
    # The alternative was adding CORS to the daemon, which is worse: it puts an
    # origin-allowlist decision into a service whose entire security posture is "trusted
    # network, one host, no auth", in order to solve a problem created by how the UI is
    # served. No compose port change is needed either way — these are internal hostnames on
    # the compose network, and the daemon's and forge's published ports are unaffected.
    #
    # services/dashboard/vite.config.ts MIRRORS these three prefixes for `vite dev`. The two
    # must agree, or a surface that works in development 404s in the image.

    # The daemon owns /api/* (Agent Runtime R3a). Proxied with the path intact.
    location /api/ {
        proxy_pass http://armada-daemon:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run can take minutes and POST /api/runs returns immediately, but the read
        # timeout still has to outlast a slow validation round trip to the forge.
        proxy_read_timeout 120s;
    }

    # The daemon's WebSocket, on the SAME port as its HTTP surface. The Upgrade and
    # Connection headers are mandatory — without them the daemon answers 426 rather than
    # upgrading, which is exactly what `GET /ws` without an upgrade is specified to do.
    location /ws {
        proxy_pass http://armada-daemon:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # An event stream is idle between events by nature; the default 60s would drop a
        # socket watching a slow run and the client would read it as a disconnect.
        proxy_read_timeout 3600s;
    }

    # The forge declares its routes at the ROOT (`/corpora`, `/models/bindings`, `/health`),
    # which would collide with the SPA's own paths. So it is reached under a /forge prefix
    # that is stripped here. The trailing slash on proxy_pass is what does the stripping —
    # removing it would forward `/forge/corpora` verbatim and every forge call would 404.
    location /forge/ {
        proxy_pass http://armada-forge:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ingestion and materialization progress ride the forge's own WebSocket at
        # /forge/ws, so this block carries the upgrade headers too.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Compose healthcheck target. Static 200 — this service has no backing dependency of
    # its own, so "serving" is the whole of its readiness. The daemon and forge health
    # endpoints report their own state, and the navigation rail's health strip reads the
    # daemon's fan-out rather than this.
    #
    # Declared with `=` so it is an exact match and cannot be shadowed by the proxy blocks
    # above or swallowed by the SPA fallback below.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"armada-dashboard"}';
    }

    # Hashed build assets are immutable by name, so they may be cached hard. index.html
    # must NOT be, or a deployed build keeps serving the previous asset manifest.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback. Client-side routes (/runs/{id}, /agents/{id}/edit, ...) must
    # survive a page reload, which means an unknown path returns index.html rather than 404.
    # This is why main.tsx uses BrowserRouter rather than HashRouter — the two have to agree
    # or this block is dead configuration.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
