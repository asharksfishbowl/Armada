name: CI

# ─────────────────────────────────────────────────────────────────────────────
# The Docker host Armada does not otherwise have.
#
# Development happens in a container with no Docker daemon, no root, and no
# sudo, so the five services could never be brought up together there. This
# repo is public, so GitHub-hosted runners are free and unlimited, ship Docker
# and Compose v2 preinstalled, and are CPU-only — which is Armada's target
# hardware rather than a compromise.
#
# NO SECRETS. This workflow must never require one. Invariant 7 says the default
# path contacts no paid endpoint; if CI ever needs a credential, that invariant
# has been broken upstream and the fix belongs there, not here.
# ─────────────────────────────────────────────────────────────────────────────

# WHEN THIS RUNS: on merge to main, not on raising a PR.
#
# A PR-time run tested a merge commit that did not exist yet, then main re-tested the
# same tree minutes later and every change appeared to fire CI twice. Testing the merge
# result once, on main, is the same coverage without the double report.
#
# The trade, stated because it is real: nothing gates the merge. CI here DETECTS a
# regression on main rather than PREVENTING it from landing, and a branch-protection
# rule cannot require a check that never runs on a PR. Recovery is roll forward.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - 'design-references/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

# NEVER CANCEL A RUN THAT IS THE ONLY VERIFICATION A COMMIT WILL EVER GET.
#
# This was `cancel-in-progress: true`, carried over from when CI also ran on pull
# requests and superseding a run was free — the PR would be tested again anyway.
# It is not free now. Since CI runs only on the merge to main, each run is the sole
# end-to-end check of one commit, and cancelling it means that commit is never
# verified by anything.
#
# It had already happened three times when this was found: f9ce33f, d72272a and
# eeb6d86 all show `conclusion: cancelled` because the next merge landed while their
# smoke job was still booting the stack. Nothing reported a gap — a cancelled run is
# not a red run, so main looked fine while three commits had been checked by nothing.
#
# The trade is latency: merges now queue instead of superseding, and the smoke job
# takes minutes. That is the correct direction. A slow answer about every commit
# beats a fast answer about some of them.
#
# The group is kept so runs still serialise rather than piling up concurrently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The fast guard. No Docker, target under 2 minutes. Gates the 15-minute stack
  # boot below, so a red unit suite costs one runner-minute instead of twenty.
  # ───────────────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            services/daemon/package-lock.json
            services/dashboard/package-lock.json

      # `tsc && node --test`. Node 22 ships the test runner, so there is no
      # framework dependency to install or license.
      - name: daemon — npm ci && npm test
        working-directory: services/daemon
        run: |
          npm ci
          npm test

      # THE DASHBOARD SUITE RAN NOWHERE UNTIL THIS STEP EXISTED.
      #
      # P9 landed 42 passing tests and no CI step to run them. That is the ninth instance
      # of this repo's signature defect — something written, working, and never called —
      # except here it is the test suite itself, which is the thing that is supposed to
      # catch the other eight.
      #
      # `npm ci` and not `npm install`: the lockfile is the point, and install would
      # silently resolve a different tree than the one that was reviewed.
      - name: dashboard — npm ci && npm test
        working-directory: services/dashboard
        run: |
          npm ci
          npm test

      # The bundle must actually build. A dashboard whose tests pass and whose build fails
      # is not shippable, and `tsc` in the test script only type-checks the test tree.
      - name: dashboard — npm run build
        working-directory: services/dashboard
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'          # matches services/forge/Dockerfile
          cache: pip
          cache-dependency-path: |
            services/forge/requirements.txt
            services/forge/requirements-dev.txt

      # pytest.ini already registers the `integration` marker and sets
      # --strict-markers, so this deselects stack-dependent tests without any
      # further configuration.
      - name: forge — pytest (unit only)
        working-directory: services/forge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -m "not integration"

  # ───────────────────────────────────────────────────────────────────────────
  # The end-to-end guard. Merges to main, or on demand.
  #
  # Gated on `unit` deliberately: a red unit suite makes a 15-minute stack boot
  # a waste of a runner.
  # ───────────────────────────────────────────────────────────────────────────
  smoke:
    name: Smoke test (full stack)
    # `needs: unit` is safe again now that unit runs on the same events this does. It was
    # removed when unit was PR-only, because a `needs` on a SKIPPED job skips the dependent
    # too — which would have silently deleted the only end-to-end check in the pipeline.
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest has ~14 GB free. Our footprint is small — two pulled
      # images, the rest built locally, and a ~0.5 GB baked smoke model — but
      # reclaiming the preinstalled toolchains is cheap insurance against a
      # failure that would look like a real defect rather than a full disk.
      - name: Reclaim runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h / | tail -1

      - name: Preflight
        run: |
          docker --version
          docker compose version
          jq --version

      # R45c bind-mounts the workspace root at the SAME path inside and outside the
      # daemon, because the daemon passes `--volume <workspace>:/workspace` to Docker
      # and Docker resolves that against the HOST. The default is /var/lib/armada/
      # workspaces, which the runner user cannot create — so section 7 skipped, and
      # took the ingestion, embedding-dimension and R16b checks with it.
      #
      # Provisioned rather than redirected: pointing ARMADA_WORKSPACE_ROOT at a temp
      # dir would pass while testing a path no real installation uses. Creating the
      # real default keeps CI honest about what it verified.
      - name: Provision workspace root
        run: |
          # Two roots, deliberately separate (R8a). `workspaces` is the daemon's, for
          # sandbox provisioning. `ingest` is forge's, for `directory` Sources. Sharing
          # one would couple sandbox provisioning to corpus ingestion across
          # cross-service boundary 1.
          sudo mkdir -p /var/lib/armada/workspaces /var/lib/armada/ingest
          sudo chown -R "$(id -u):$(id -g)" /var/lib/armada
          ls -ld /var/lib/armada/workspaces /var/lib/armada/ingest

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # ── Invariant 7, exercised rather than asserted ──────────────────────
      # ISSUE #11 offered two options: infer from logs that no outbound call was
      # attempted, or SKIP the check in CI. Both are weaker than the invariant
      # deserves. This is a third: sever egress at the network layer and require
      # the stack to work anyway.
      #
      # Images are already pulled and built by the step above, which is the same
      # scoping build-plan Req 1 uses — "after container images are pulled". The
      # overlay then recreates the stack on a network with no gateway, so any
      # attempt to reach a model provider fails hard instead of being inferred.
      - name: Zero-egress verification
        run: |
          docker compose down -v
          docker compose -f docker-compose.yml -f docker-compose.ci-internal.yml up -d
          echo "Stack is up on an internal network — no route off the host."

          # QUERIED FROM INSIDE THE NETWORK, NOT FROM THE RUNNER.
          #
          # `internal: true` removes the network's gateway, and that also disables
          # published port mapping — so localhost:8000 on the runner is unreachable even
          # while the stack is perfectly healthy. The previous version curled from the
          # host, timed out, and reported "forge never became healthy with egress
          # severed" while the forge logs showed it answering 200 OK to its own
          # healthcheck and to peer containers throughout.
          #
          # That is the third time in this pipeline a true statement named the wrong
          # cause. Observing from inside the boundary is the only way to test a boundary
          # that, by design, blocks observation from outside.
          # One line: python -c rejects the indentation a YAML block would impose.
          q() { docker compose exec -T armada-forge python -c "import sys,urllib.request; print(urllib.request.urlopen('http://localhost:8000'+sys.argv[1], timeout=10).read().decode())" "$1" 2>/dev/null; }

          ok=0
          for _ in $(seq 1 150); do
            if q /health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::group::state at timeout"
            docker compose ps -a || true
            docker compose logs --tail 60 armada-forge armada-db armada-migrate || true
            echo "::endgroup::"
            echo "::error::forge never became healthy with egress severed"
            exit 1
          fi
          echo "forge is healthy with no route off the host."

          # Registration must not require reaching any model provider.
          n="$(q /models/bindings | jq '[.[]|select(.status=="promoted")]|length')"
          echo "promoted bindings with no egress: $n"
          [ "$n" = "5" ] || { echo "::error::expected 5 promoted bindings, got $n"; exit 1; }

          # And the baked model must still answer, since it was never downloaded.
          q /models/bindings | jq -e '[.[]|select(.materialized==true)]|length == 1' >/dev/null \
            || { echo "::error::baked smoke model is not materialized under zero egress"; exit 1; }

          echo "Invariant 7 holds: the default path needs no egress."

      # A red run with no logs is barely better than no CI.
      #
      # Collected here rather than globbed from the smoke script's own output:
      # that script logs to mktemp paths, so any fixed glob would match nothing
      # and upload an empty artifact that looks like "no logs were produced".
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p /tmp/ci-logs
          docker compose logs --no-color --timestamps > /tmp/ci-logs/compose.log 2>&1 || true
          docker compose ps -a > /tmp/ci-logs/ps.txt 2>&1 || true
          df -h / > /tmp/ci-logs/disk.txt 2>&1 || true
          echo "collected:"; ls -la /tmp/ci-logs
          echo "── last 100 lines ──"
          tail -100 /tmp/ci-logs/compose.log || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs-${{ github.run_id }}
          path: /tmp/ci-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v || true
