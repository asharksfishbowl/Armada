server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose healthcheck target. Static 200 — this service has no backing dependency of
    # its own, so "serving" is the whole of its readiness. The daemon and forge health
    # endpoints report their own state.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"armada-dashboard"}';
    }

    # SPA history fallback. Phase 8's client-side routes (/runs/{id}, /agents, ...) must
    # survive a page reload, which means unknown paths return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
